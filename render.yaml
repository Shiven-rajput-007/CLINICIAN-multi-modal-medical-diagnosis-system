services:
  - type: web
    name: clinician-medical-diagnosis-api
    runtime: python
    buildCommand: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && cd .. && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: MODEL_DEVICE
        value: cpu
      - key: DEBUG
        value: "false"
