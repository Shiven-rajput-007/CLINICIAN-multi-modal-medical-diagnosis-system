services:
  - type: web
    name: clinician-medical-diagnosis-api
    runtime: python
    buildCommand: pip install --no-cache-dir torch==2.14.1+cpu torchvision==0.29.1+cpu --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && cd .. && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: MODEL_DEVICE
        value: cpu
      - key: DEBUG
        value: "false"
